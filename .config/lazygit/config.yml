# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

# If true, exit Lazygit when the user presses escape in a context where there is nothing to cancel/close
quitOnTopLevelReturn: true

# If true, don't display introductory popups upon opening Lazygit.
disableStartupPopups: true

# If true, display a confirmation when subprocess terminates. This allows you to view the output of the subprocess before returning to Lazygit.
promptToReturnFromSubprocess: false

git:
  overrideGpg: true

customCommands:
  - key: d
    description: Amend commit date
    context: commitMessage
    prompts:
      - key: Timestamp
        type: input
        initialValue: "{{.SelectedCommit.CommitterDate}}"
        label: New date (RFC3339)
    command: >
      {{$date := .Form.Timestamp}}
      {{$sha := .SelectedCommit.Sha}}
      {{$rebase := runCommand "ls -d .git/rebase-merge .git/rebase-apply 2>/dev/null"}}
      orig=$(git rev-parse HEAD) &&
      (git stash --include-untracked || true) &&
      (
        {{if $rebase}}
          GIT_AUTHOR_DATE={{$date}} GIT_COMMITTER_DATE={{$date}} git commit --amend --no-edit --date {{quote $date}} && git rebase --continue
        {{else}}
          GIT_AUTHOR_DATE={{$date}} GIT_COMMITTER_DATE={{$date}} git commit --fixup={{$sha}} --date {{quote $date}} && git rebase --autosquash {{$sha}}^
        {{end}}
      ) && git stash pop || {
        git rebase --abort 2>/dev/null || true
        git reset --hard $orig
        git stash pop 2>/dev/null || git stash drop 2>/dev/null || true
        echo "FAILED: rebase conflict or error - workspace restored"
        exit 1
      }
