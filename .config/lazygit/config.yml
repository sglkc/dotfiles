# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # The number of lines you scroll by when scrolling the main window
  scrollHeight: 10

  # If true, allow scrolling past the bottom of the content in the main window
  scrollPastBottom: true

  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#scroll-off-margin
  scrollOffMargin: 2

  # One of: 'margin' (default) | 'jump'
  scrollOffBehavior: margin

# If true, exit Lazygit when the user presses escape in a context where there is nothing to cancel/close
quitOnTopLevelReturn: true

# If true, don't display introductory popups upon opening Lazygit.
disableStartupPopups: true

# If true, display a confirmation when subprocess terminates. This allows you to view the output of the subprocess before returning to Lazygit.
promptToReturnFromSubprocess: false

git:
  overrideGpg: true

customCommands:
  - key: 'D'
    context: 'commits, subCommits'
    description: 'Set author/committer dates'
    loadingText: 'Setting dates...'
    prompts:
      - type: input
        title: 'Author date (e.g. 2024-01-15 10:30:00)'
        key: AuthorDate
        # Selected commit author time (not "now"), no timezone.
        # printf is a Go template builtin; %% becomes a literal % for git.
        initialValue: '{{ runCommand (printf "git -c log.showSignature=false log -1 --format=%%ad --date=format:%%Y-%%m-%%d\\ %%H:%%M:%%S %s" .SelectedCommit.Hash) }}'
      - type: input
        title: 'Committer date (blank = same as author)'
        key: CommitterDate
        initialValue: '{{ runCommand (printf "git -c log.showSignature=false log -1 --format=%%cd --date=format:%%Y-%%m-%%d\\ %%H:%%M:%%S %s" .SelectedCommit.Hash) }}'
    command: |
      ~/.config/lazygit/set-commit-dates \
        --hash {{.SelectedCommit.Hash | quote}} \
        --author-date {{.Form.AuthorDate | quote}} \
        {{ if .Form.CommitterDate }}--committer-date {{.Form.CommitterDate | quote}}{{ end }}
